<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>My test page</title>
        

        <!-- This links your external style.css file to this HTML page, if u want to use from otherfile. -->
        <link rel="stylesheet" href="style.css" />
    
    <!-- Here is where we write our CSS to target the class -->
  </head>
  <body>

<!-- Home page: everything except the calendar -->
    <div class="page" id="homePage">
      <!-- Date/login header - only shown on the Home page, not the other tabs -->
      <div class="title-page" id="title-page">

        <h1 class="center-text">Weight Log</h1>
        <!-- Puts todays date and date below, p does text date div gives empty box, js calls datebox and provides back date.-->
        <p class="center-text">Date: <div class="center-text"  id="dateBox"></div></p>

        <!-- Login status: buttons to log in / out - the buttons themselves show login state, no separate status text needed. -->
        <div class="center-container" id="authStatus">
          <button class="glass-button" id="loginButton">Log In</button>
          <button class="glass-button" id="logoutButton" style="display: none;">Log Out</button>
        </div>
      </div>

      <div class="weeklyAvg" id="WeeklyAvg">
        <h3 class="center-text">Today's Weight</h3>
        <!-- This is an input field for the user to enter their weight -->
        <input class="input-box" id="weight" type="number"  placeholder="Enter Weight"/>

        <!-- enter button to sumbit the weight-->
        <button class="glass-button" id="submit-button">Submit</button>

        <!-- Mon-Sun strip: today highlighted, a dot marks days with an entry, click a day to open its popup -->
        <div class="day-strip" id="weekStrip"></div>

        <!-- JS gonna give us average this week of the inputs-->
        <div class="center-container">
          <p class="center-text">Average this week:</p>
          <div id="thisWeekAverage"></div>
        </div>
      </div>
    </div>

    <!-- Overview page: pick a week, see its avg weight/steps, and a recent trend -->
    <div class="page" id="overviewPage">
      <h1 class="center-text">Overview</h1>
      <!-- Only shown when logged out - same modal/button as the one on Home -->
      <button class="glass-button login-prompt-button" style="display: none;">Log In</button>

      <div class="weeklyAvg overview-panel">
        <div class="week-selector">
          <button id="overviewPrevWeek">&lt;</button>
          <div class="week-label">
            <span id="overviewWeekLabel"></span>
            <span class="range" id="overviewWeekRange"></span>
          </div>
          <button id="overviewNextWeek">&gt;</button>
        </div>

        <div class="stat-row">
          <div class="stat-tile weight">
            <span class="value" id="overviewWeightValue"></span>
            <span class="label">Avg weight</span>
          </div>
          <div class="stat-tile steps">
            <span class="value" id="overviewStepsValue"></span>
            <span class="label">Avg steps</span>
          </div>
        </div>
      </div>

      <div class="weeklyAvg overview-panel">
        <div class="chart-title"><span class="swatch weight"></span>Weight trend (last 8 weeks)</div>
        <div class="chart-wrap" id="overviewWeightChart"></div>
      </div>

      <div class="weeklyAvg overview-panel">
        <div class="chart-title"><span class="swatch steps"></span>Steps trend (last 8 weeks)</div>
        <div class="chart-wrap" id="overviewStepsChart"></div>
      </div>

      <div class="weeklyAvg overview-panel">
        <div class="chart-header">
          <span class="chart-title-text">Measurements trend (last 8 weeks)</span>
          <select class="measurement-select" id="overviewMeasurementSelect">
            <option value="all">All measurements</option>
          </select>
        </div>
        <div class="chart-wrap" id="overviewMeasurementsChart"></div>
      </div>
    </div>

    <!-- Calendar page -->
    <div class="page" id="calendarPage">
      <h1 class="center-text">Calendar</h1>
      <!-- Only shown when logged out - same modal/button as the one on Home -->
      <button class="glass-button login-prompt-button" style="display: none;">Log In</button>

      <div class="calender">

          <div class="header">
            <button id="prevButton">
              <
            </button>

            <div class="monthYear" id="monthYear"> </div>

            <button id="nextButton">
              >
            </button>

          </div>
          <div class="calenderBody">
            <div class="weekButton" id="weekButton"></div>
            <div class="dates" id="dates"></div>
          </div>
      </div>
    </div>

    <!-- Photos page: weekly Front/Back/Side check-in photos -->
    <div class="page" id="photosPage">
      <h1 class="center-text">Photos</h1>
      <!-- Only shown when logged out - same modal/button as the one on Home -->
      <button class="glass-button login-prompt-button" style="display: none;">Log In</button>
      <p class="page-subtitle center-text">Front / back / side check-ins, one row per week</p>

      <div class="photo-filter-bar" id="photoFilterBar">
        <button class="photo-filter-button active" data-filter="all">All</button>
        <button class="photo-filter-button" data-filter="front">Front</button>
        <button class="photo-filter-button" data-filter="back">Back</button>
        <button class="photo-filter-button" data-filter="side">Side</button>
      </div>

      <div class="photo-week-list" id="photoWeekList"></div>
    </div>

    <!-- Bottom nav: switches between the pages above -->
    <nav class="page-nav">
      <button class="page-nav-button" id="navHomeButton" data-page="homePage">Home</button>
      <button class="page-nav-button" id="navOverviewButton" data-page="overviewPage">Overview</button>
      <button class="page-nav-button" id="navCalendarButton" data-page="calendarPage">Calendar</button>
      <button class="page-nav-button" id="navPhotosButton" data-page="photosPage">Photos</button>
    </nav>

          <div class="modal-overlay" id="modalOverlay">
              <div class="modal" id="modal" role="dialog" aria-modal="true">
                <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
                <h3 id="modalTitle"></h3>
                <div id="modalBody"></div>
                <button class="glass-button" id="modalSaveButton">Save</button>
                <button class="glass-button" id="modalDeleteButton">Delete</button>
              </div>
          </div>



   <script src="app.js"></script>
   <script src="modal.js"></script>
   <script src="avg-override-panel.js"></script>
   <script src="tab-toggle.js"></script>
   <script src="measurements-ui.js"></script>
   <script src="measurements-tab.js"></script>
   <script src="week-modal.js"></script>
   <script src="auth-ui.js"></script>
   <script src="steps-ui.js"></script>
   <script src="photos-ui.js"></script>
   <script src="trend-chart.js"></script>
   <script src="overview.js"></script>
   <script src="photos-page.js"></script>
   <script src="pages.js"></script>
   <script src="calender.js"></script>
  
  </body>
</html>
